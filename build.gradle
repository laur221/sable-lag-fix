plugins {
    id 'java'
    id 'net.neoforged.moddev' version "${moddev_version}"
}

version = project.mod_version
group = project.mod_group
base {
    archivesName = project.mod_id
}

repositories {
    mavenLocal()
    maven {
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.minecraft_version
    }

    runs {
        client {
            client()
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    compileOnly "maven.modrinth:sable:2.0.6+mc1.21.1"
    runtimeOnly "maven.modrinth:sable:2.0.6+mc1.21.1"
    runtimeOnly "maven.modrinth:create-aeronautics:44pLdPGg"
    runtimeOnly "maven.modrinth:create:UjX6dr61"
    runtimeOnly "maven.modrinth:spark:v5qtqRQi"
}

processResources {
    def props = [
        mod_version    : project.mod_version,
        mod_name       : project.mod_name,
        mod_id         : project.mod_id,
        mod_license    : project.mod_license,
        mod_authors    : project.mod_authors,
        mod_description: project.mod_description
    ]
    inputs.properties props
    filesMatching("META-INF/neoforge.mods.toml") {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    def projectName = project.name
    inputs.property "projectName", projectName
    from("LICENSE") {
        rename { "${it}_$projectName" }
    }
}